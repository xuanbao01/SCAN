<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="扫题助手">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>扫题助手</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111;color:#eee;font:16px/1.4 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#cam{position:relative;height:36vh;background:#000;flex:none}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#status{position:absolute;left:6px;top:6px;font-size:12px;background:#0009;padding:2px 8px;border-radius:10px;color:#9f9}
#status.warn{color:#fc6}
#ans{flex:1;overflow:auto;padding:12px 16px}
#big{font-size:min(26vw,120px);font-weight:800;line-height:1.05;text-align:center;letter-spacing:4px;margin:6px 0 4px;min-height:1.1em;word-break:break-all}
#big.high{color:#3ddc84}#big.mid{color:#ffcc33}#big.low{color:#ff6b6b}#big.idle{color:#555;font-size:28px;letter-spacing:0;padding-top:20px}
#meta{text-align:center;color:#aaa;font-size:14px}
#meta b{color:#eee}
.tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:12px;margin-left:4px}
.tag.high{background:#1e5e3a}.tag.mid{background:#6a5310}.tag.low{background:#6a1f1f}
#opts{margin-top:10px;font-size:17px}
#opts div{padding:6px 10px;margin:4px 0;background:#1f2a22;border-left:4px solid #3ddc84;border-radius:4px}
#stem{margin-top:10px;font-size:13px;color:#888}
#altbox{margin-top:8px;font-size:13px;color:#aaa}
#altbox div{padding:4px 0;border-top:1px dashed #333}
#bar{flex:none;display:flex;gap:8px;padding:8px 10px;background:#1a1a1a;border-top:1px solid #2a2a2a}
#bar button{flex:1;padding:12px 0;border:0;border-radius:10px;background:#2b2b2b;color:#eee;font-size:16px}
#bar button.primary{background:#2f7d4f;color:#fff;font-weight:600}
#bar button.on{background:#7d2f2f}
.sheet{position:fixed;inset:0;background:#111;z-index:10;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sheet.show{display:flex}
.sheet header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #2a2a2a;font-weight:600;font-size:18px}
.sheet header span{flex:1}
.sheet header button{background:#2b2b2b;color:#eee;border:0;border-radius:8px;padding:8px 14px;font-size:15px;margin-left:6px}
.sheet .body{flex:1;overflow:auto;padding:12px 14px}
#list .row{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid #222;align-items:baseline}
#list .num{width:3.2em;color:#888;text-align:right;flex:none}
#list .a{font-size:22px;font-weight:700;width:4.2em;flex:none}
#list .a.high{color:#3ddc84}#list .a.mid{color:#ffcc33}#list .a.low{color:#ff6b6b}
#list .s{color:#888;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
#list .miss .a{color:#555}
#q{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#eee}
.res{padding:10px 0;border-bottom:1px solid #222}
.res .rs{font-size:15px}.res .ra{color:#3ddc84;font-weight:700;margin-top:4px}
.set p{margin:8px 0 18px;color:#aaa;font-size:14px}
.set label{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:16px}
.set select,.set input[type=file]{font-size:15px}
.btn{display:inline-block;background:#2f7d4f;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px}
#dbg{white-space:pre-wrap;font-size:12px;color:#7a7;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="status">正在加载…</div>
  </div>
  <div id="ans">
    <div id="big" class="idle">把手机对准考试屏幕，点「开始」</div>
    <div id="meta"></div>
    <div id="opts"></div>
    <div id="stem"></div>
    <div id="altbox"></div>
    <div id="dbg"></div>
  </div>
  <div id="bar">
    <button id="bStart" class="primary">开始</button>
    <button id="bList">清单</button>
    <button id="bSearch">搜索</button>
    <button id="bSet">设置</button>
  </div>
</div>

<div class="sheet" id="sList">
  <header><span>答案清单<br><small id="listInfo" style="color:#888;font-weight:400;font-size:13px"></small></span><button id="bCopy">复制</button><button id="bClear">清空</button><button data-close>关闭</button></header>
  <div class="body" id="list"></div>
</div>

<div class="sheet" id="sSearch">
  <header><span>手动搜索</span><button data-close>关闭</button></header>
  <div class="body">
    <input id="q" placeholder="输入题干里的几个关键词" autocomplete="off">
    <div id="results"></div>
  </div>
</div>

<div class="sheet" id="sSet">
  <header><span>设置</span><button data-close>关闭</button></header>
  <div class="body set">
    <div><b>题库</b>：<span id="bankInfo">未导入</span></div>
    <p>支持 .et / .xls / .xlsx 题库文件（就是现在这种模板格式）。题库只保存在本手机里，不会上传。题库更新后重新导入即可，会自动覆盖旧的。</p>
    <label class="btn" style="justify-content:center">导入题库文件<input id="file" type="file" accept=".et,.xls,.xlsx,.csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none"></label>
    <hr style="border-color:#2a2a2a">
    <label>识别精度
      <select id="optLimit"><option value="960">标准（更快）</option><option value="1280">高（字小/离得远时用）</option></select></label>
    <label><input type="checkbox" id="optSound" checked> 出答案时提示音</label>
    <label><input type="checkbox" id="optBoxes" checked> 在画面上标出识别到的文字</label>
    <label><input type="checkbox" id="optDebug"> 显示识别原文（排查问题用）</label>
    <p id="envInfo"></p>
  </div>
</div>

<script src="vendor/ort.wasm.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="ocr.js"></script>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
